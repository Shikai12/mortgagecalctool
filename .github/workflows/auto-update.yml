name: Auto Update SEO Files

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect domain
        id: domain
        run: |
          if [ -f CNAME ]; then
            echo "domain=$(cat CNAME)" >> $GITHUB_OUTPUT
          else
            echo "domain=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          fi

      - name: Run build script
        run: python build.py
        env:
          NO_BACKUP: 1
          SITE_DOMAIN: ${{ steps.domain.outputs.domain }}

      - name: Clean backup files
        run: |
          # 删除 build.py 生成的备份文件
          find . -name "*.bak.*" -type f -delete
          find . -name "*.checksum" -type f -delete
          echo "Backup files cleaned"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update SEO files"
          git push
